<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>İş Akım Şeması</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #000000;
      font-family: Arial, "Liberation Sans", Helvetica, sans-serif;
    }
    .page {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 28px 16px 32px;
    }
    .flow {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 540px;
    }
    .box {
      width: 100%;
      min-height: 52px;
      border: 1.5px solid #000000;
      border-radius: 12px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px 18px;
      font-size: 15px;
      letter-spacing: 0.02em;
      line-height: 1.3;
    }
    .arrow {
      width: 0;
      height: 36px;
      position: relative;
      margin: 0;
    }
    .arrow::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 1.6px;
      height: 26px;
      background: #000000;
      transform: translateX(-50%);
    }
    .arrow::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 22px;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 10px solid #000000;
    }
    @media print {
      .page { padding: 12px 0 24px; }
      .box { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="flow">
      <div class="box">HAMMADDE KABUL</div>
      <div class="arrow" aria-hidden="true"></div>
      <div class="box">HAMMADDE DEPOLAMA</div>
      <div class="arrow" aria-hidden="true"></div>
      <div class="box">DOKUMA İŞLEMİ</div>
      <div class="arrow" aria-hidden="true"></div>
      <div class="box">KALİTE KONTROL</div>
      <div class="arrow" aria-hidden="true"></div>
      <div class="box">LATEKS (SIRT KAPLAMA) İŞLEMİ</div>
      <div class="arrow" aria-hidden="true"></div>
      <div class="box">KALİTE KONTROL</div>
      <div class="arrow" aria-hidden="true"></div>
      <div class="box">SARIM VE PAKETLEME</div>
      <div class="arrow" aria-hidden="true"></div>
      <div class="box">DEPOLAMA</div>
      <div class="arrow" aria-hidden="true"></div>
      <div class="box">SEVKİYAT</div>
    </div>
  </main>
</body>
</html>

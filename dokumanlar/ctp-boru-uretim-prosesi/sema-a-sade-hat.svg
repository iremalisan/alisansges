<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1180" width="640" height="1180">
  <style>
    .title { font: 700 17px "Segoe UI", Calibri, sans-serif; fill: #154360; }
    .cap { font: 600 12px "Segoe UI", Calibri, sans-serif; fill: #5d6d7e; }
    .box { fill: #1f618d; }
    .box-start { fill: #154360; }
    .box-end { fill: #117a65; }
    .box-opt { fill: #ffffff; stroke: #d35400; stroke-width: 2.2; stroke-dasharray: 7 5; }
    .lbl { font: 700 14px "Segoe UI", Calibri, sans-serif; fill: #ffffff; text-anchor: middle; }
    .lbl-d { font: 700 13px "Segoe UI", Calibri, sans-serif; fill: #d35400; text-anchor: middle; }
    .hint { font: 400 11.5px "Segoe UI", Calibri, sans-serif; fill: #d6eaf8; text-anchor: middle; }
    .hint-d { font: 400 11px "Segoe UI", Calibri, sans-serif; fill: #a04000; text-anchor: middle; }
    .line { stroke: #2e86c1; stroke-width: 2.6; fill: none; marker-end: url(#arr); }
    .line-o { stroke: #d35400; stroke-width: 2.2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arr-o); }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2e86c1"/>
    </marker>
    <marker id="arr-o" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d35400"/>
    </marker>
  </defs>
  <rect width="640" height="1180" fill="#ffffff"/>
  <text x="320" y="36" class="title" text-anchor="middle">&#350;ema A &#8212; CTP Altyap&#305; Borusu &#220;retim Hatt&#305;</text>
  <text x="320" y="56" class="cap" text-anchor="middle">Cam Elyaf Takviyeli Polyester Altyap&#305; Borular&#305; &#220;retim Faaliyeti</text>

  <rect class="box-start" x="145" y="78" rx="12" width="350" height="70"/>
  <text class="lbl" x="320" y="106">1. Hammadde girdi kontrol ve stoklama</text>
  <text class="hint" x="320" y="126">Cam elyaf, kum, re&#231;ine</text>
  <line class="line" x1="320" y1="148" x2="320" y2="178"/>

  <rect class="box" x="145" y="182" rx="12" width="350" height="70"/>
  <text class="lbl" x="320" y="210">2. Winder&#8217;da boru &#252;retimi</text>
  <text class="hint" x="320" y="230">G&#252;nl&#252;k tank / raf &#183; d&#246;ner kal&#305;ba sar&#305;m</text>
  <line class="line" x1="320" y1="252" x2="320" y2="282"/>

  <rect class="box" x="145" y="286" rx="12" width="350" height="58"/>
  <text class="lbl" x="320" y="321">3. Boru boy kesme</text>
  <line class="line-o" x1="320" y1="344" x2="320" y2="376"/>

  <rect class="box-opt" x="145" y="380" rx="12" width="350" height="70"/>
  <text class="lbl-d" x="320" y="408">ODD tamir &#252;nitesi &#8212; ihtiya&#231; halinde</text>
  <text class="hint-d" x="320" y="428">Hata yoksa bu ad&#305;m atlan&#305;r</text>
  <line class="line" x1="320" y1="450" x2="320" y2="480"/>

  <rect class="box" x="145" y="484" rx="12" width="350" height="58"/>
  <text class="lbl" x="320" y="519">4. Boru ucu kalibrasyon</text>
  <line class="line" x1="320" y1="542" x2="320" y2="572"/>

  <rect class="box" x="145" y="576" rx="12" width="350" height="58"/>
  <text class="lbl" x="320" y="611">5. Hidrotest</text>
  <line class="line" x1="320" y1="634" x2="320" y2="664"/>

  <rect class="box" x="145" y="668" rx="12" width="350" height="58"/>
  <text class="lbl" x="320" y="703">6. Coupling kanal a&#231;ma</text>
  <line class="line" x1="320" y1="726" x2="320" y2="756"/>

  <rect class="box" x="145" y="760" rx="12" width="350" height="58"/>
  <text class="lbl" x="320" y="795">7. Stopper ve conta montaj&#305;</text>
  <line class="line" x1="320" y1="818" x2="320" y2="848"/>

  <rect class="box-end" x="145" y="852" rx="12" width="350" height="70"/>
  <text class="lbl" x="320" y="880">8. Stok sahas&#305;na sevk</text>
  <text class="hint" x="320" y="900">&#304;stifleme &#183; sevkiyat &#183; m&#252;&#351;teri</text>

  <rect x="70" y="960" width="500" height="72" rx="10" fill="#eaf2f8" stroke="#aed6f1"/>
  <text x="320" y="988" text-anchor="middle" style="font:700 12px 'Segoe UI',sans-serif;fill:#154360">Do&#287;al kaynak kullan&#305;m&#305;: Su &#183; Hava &#183; Elektrik</text>
  <text x="320" y="1010" text-anchor="middle" style="font:12px 'Segoe UI',sans-serif;fill:#5d6d7e">Kesik &#231;er&#231;eve: her boruda yok, yaln&#305;zca y&#252;zey hatas&#305; varsa</text>

  <text x="320" y="1070" class="cap" text-anchor="middle">Hasarl&#305; &#252;r&#252;n: k&#252;&#231;&#252;k kusur onar&#305;l&#305;r; kullan&#305;lamayan lisansl&#305; geri d&#246;n&#252;&#351;&#252;me gider (&#350;ema B).</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <style>
    .title { font: 700 18px "Segoe UI", Calibri, sans-serif; fill: #154360; }
    .cap { font: 600 12px "Segoe UI", Calibri, sans-serif; fill: #5d6d7e; }
    .box { fill: #2471a3; }
    .box-start { fill: #154360; }
    .box-end { fill: #117a65; }
    .box-opt { fill: #ffffff; stroke: #d35400; stroke-width: 2; stroke-dasharray: 7 5; }
    .box-def { fill: #ffffff; stroke: #922b21; stroke-width: 2; }
    .box-rec { fill: #196f3d; }
    .lbl { font: 700 13px "Segoe UI", Calibri, sans-serif; fill: #ffffff; text-anchor: middle; }
    .lbl-dark { font: 700 13px "Segoe UI", Calibri, sans-serif; fill: #d35400; text-anchor: middle; }
    .lbl-red { font: 700 13px "Segoe UI", Calibri, sans-serif; fill: #922b21; text-anchor: middle; }
    .hint { font: 400 11px "Segoe UI", Calibri, sans-serif; fill: #eaf2f8; text-anchor: middle; }
    .hint-dark { font: 400 11px "Segoe UI", Calibri, sans-serif; fill: #a04000; text-anchor: middle; }
    .hint-red { font: 400 11px "Segoe UI", Calibri, sans-serif; fill: #922b21; text-anchor: middle; }
    .side { font: 700 11px "Segoe UI", Calibri, sans-serif; }
    .dia { fill: #fcf3cf; stroke: #b7950b; stroke-width: 2; }
    .dia-t { font: 700 12px "Segoe UI", Calibri, sans-serif; fill: #7d6608; text-anchor: middle; }
    .line { stroke: #2e86c1; stroke-width: 2.5; fill: none; marker-end: url(#arr); }
    .line-o { stroke: #d35400; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arr-o); }
    .line-r { stroke: #922b21; stroke-width: 2; fill: none; marker-end: url(#arr-r); }
    .line-g { stroke: #196f3d; stroke-width: 2; fill: none; marker-end: url(#arr-g); }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2e86c1"/>
    </marker>
    <marker id="arr-o" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d35400"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#922b21"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#196f3d"/>
    </marker>
  </defs>

  <rect width="720" height="1280" fill="#f4f7fa"/>
  <text x="360" y="36" class="title" text-anchor="middle">&#350;ema B &#8212; CTP Altyap&#305; Borusu &#220;retim &#304;&#351; Ak&#305;&#351;&#305;</text>
  <text x="360" y="56" class="cap" text-anchor="middle">Hammadde, &#252;retim, kontrol, montaj, stok. Su, hava, elektrik t&#252;m hat boyunca kullan&#305;l&#305;r.</text>

  <rect class="box-start" x="185" y="78" rx="10" width="350" height="58"/>
  <text class="lbl" x="360" y="102">Hammadde girdi kontrol ve stoklama</text>
  <text class="hint" x="360" y="120">Cam elyaf &#183; kum &#183; re&#231;ine</text>
  <line class="line" x1="360" y1="136" x2="360" y2="164"/>

  <rect class="box" x="185" y="168" rx="10" width="350" height="58"/>
  <text class="lbl" x="360" y="192">Winder &#252;nitesinde boru &#252;retimi</text>
  <text class="hint" x="360" y="210">Emprenye ve d&#246;ner kal&#305;p &#252;zerine sar&#305;m</text>
  <line class="line" x1="360" y1="226" x2="360" y2="254"/>

  <rect class="box" x="185" y="258" rx="10" width="350" height="50"/>
  <text class="lbl" x="360" y="288">Boru boy kesme</text>
  <line class="line" x1="360" y1="308" x2="360" y2="336"/>

  <g transform="translate(360,400)">
    <rect class="dia" x="-52" y="-52" width="104" height="104" transform="rotate(45)"/>
  </g>
  <text class="dia-t" x="360" y="396">Y&#252;zey hatas&#305;</text>
  <text class="dia-t" x="360" y="412">var m&#305;?</text>

  <line class="line-o" x1="434" y1="400" x2="530" y2="400"/>
  <text class="side" x="458" y="388" fill="#d35400">Evet</text>
  <rect class="box-opt" x="530" y="368" rx="10" width="170" height="64"/>
  <text class="lbl-dark" x="615" y="394">ODD tamir</text>
  <text class="hint-dark" x="615" y="412">ihtiya&#231; halinde</text>
  <line class="line-o" x1="615" y1="432" x2="615" y2="500"/>
  <line class="line-o" x1="615" y1="500" x2="360" y2="500"/>

  <text class="side" x="372" y="468" fill="#196f3d">Hay&#305;r</text>
  <line class="line" x1="360" y1="474" x2="360" y2="518"/>

  <rect class="box" x="185" y="520" rx="10" width="350" height="50"/>
  <text class="lbl" x="360" y="550">Boru ucu kalibrasyon</text>
  <line class="line" x1="360" y1="570" x2="360" y2="598"/>

  <rect class="box" x="185" y="602" rx="10" width="350" height="58"/>
  <text class="lbl" x="360" y="626">Hidrotest</text>
  <text class="hint" x="360" y="644">S&#305;zd&#305;rmazl&#305;k ve dayan&#305;m</text>
  <line class="line" x1="360" y1="660" x2="360" y2="688"/>

  <g transform="translate(360,752)">
    <rect class="dia" x="-52" y="-52" width="104" height="104" transform="rotate(45)"/>
  </g>
  <text class="dia-t" x="360" y="744">Test ve &#252;r&#252;n</text>
  <text class="dia-t" x="360" y="760">uygun mu?</text>

  <line class="line-r" x1="286" y1="752" x2="175" y2="752"/>
  <text class="side" x="200" y="740" fill="#922b21">Hay&#305;r</text>
  <rect class="box-def" x="20" y="720" rx="10" width="155" height="64"/>
  <text class="lbl-red" x="97" y="746">Hasarl&#305; imalat</text>
  <text class="hint-red" x="97" y="764">&#231;izik / &#231;apak / u&#231;</text>

  <line class="line-g" x1="97" y1="784" x2="97" y2="820"/>
  <rect class="box-rec" x="12" y="822" rx="10" width="170" height="78"/>
  <text class="lbl" x="97" y="846">&#304;ki yol</text>
  <text class="hint" x="97" y="864">k&#252;&#231;&#252;k kusur: onar&#305;m</text>
  <text class="hint" x="97" y="880">kullan&#305;lamaz: geri d&#246;n&#252;&#351;&#252;m</text>

  <path class="line-g" d="M97 900 L97 283 L185 283"/>
  <text class="side" x="108" y="270" fill="#196f3d">Onar&#305;m sonras&#305; kesmeye d&#246;n&#252;&#351;</text>

  <text class="side" x="372" y="820" fill="#196f3d">Evet</text>
  <line class="line" x1="360" y1="826" x2="360" y2="868"/>

  <rect class="box" x="185" y="872" rx="10" width="350" height="50"/>
  <text class="lbl" x="360" y="902">Coupling kanal a&#231;ma</text>
  <line class="line" x1="360" y1="922" x2="360" y2="950"/>

  <rect class="box" x="185" y="954" rx="10" width="350" height="50"/>
  <text class="lbl" x="360" y="984">Stopper ve conta montaj&#305;</text>
  <line class="line" x1="360" y1="1004" x2="360" y2="1032"/>

  <rect class="box-end" x="185" y="1036" rx="10" width="350" height="58"/>
  <text class="lbl" x="360" y="1060">Stok sahas&#305;, sevkiyat</text>
  <text class="hint" x="360" y="1078">M&#252;&#351;teri / son kullan&#305;c&#305;</text>

  <rect x="40" y="1130" width="640" height="88" rx="10" fill="#ffffff" stroke="#d5d8dc"/>
  <rect x="58" y="1152" width="16" height="16" rx="3" fill="#2471a3"/>
  <text x="80" y="1165" style="font:12px 'Segoe UI',sans-serif;fill:#1c2833">Her &#252;r&#252;nde uygulanan ad&#305;m</text>
  <rect x="58" y="1178" width="16" height="16" rx="3" fill="#ffffff" stroke="#d35400" stroke-dasharray="4 3"/>
  <text x="80" y="1191" style="font:12px 'Segoe UI',sans-serif;fill:#1c2833">Yaln&#305;zca ihtiya&#231; halinde (ODD tamir)</text>
  <rect x="320" y="1152" width="16" height="16" rx="3" fill="#ffffff" stroke="#922b21"/>
  <text x="342" y="1165" style="font:12px 'Segoe UI',sans-serif;fill:#1c2833">Hasarl&#305; / kusurlu imalat</text>
  <rect x="320" y="1178" width="16" height="16" rx="3" fill="#196f3d"/>
  <text x="342" y="1191" style="font:12px 'Segoe UI',sans-serif;fill:#1c2833">Onar&#305;m veya lisansl&#305; geri d&#246;n&#252;&#351;&#252;m</text>

  <text x="360" y="1250" class="cap" text-anchor="middle">Hammadde kimya laboratuvar&#305;nda, &#252;retilen boru mekanik laboratuvarda do&#287;rulan&#305;r.</text>
</svg>
